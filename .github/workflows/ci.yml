name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      devnet:
        description: "Also run real Solana devnet trading tests"
        type: boolean
        default: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: intelpro
          POSTGRES_PASSWORD: intelpro
          POSTGRES_DB: intelpro
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U intelpro" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://intelpro:intelpro@localhost:5432/intelpro?schema=public
      SESSION_SECRET: ${{ secrets.CI_SESSION_SECRET || 'ci-only-session-secret-not-used-anywhere-else-0000' }}
      APP_URL: http://localhost:3100
      NEXT_PUBLIC_SOLANA_NETWORK: devnet
      SEED_ADMIN_EMAIL: admin@intelpro.dev
      SEED_ADMIN_PASSWORD: ci-admin-password-1
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        # Uses the committed package-lock.json when present; the first run generates one.
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Migrate
        run: npx prisma migrate deploy
      - name: Migration drift check
        run: |
          createdb -h localhost -U intelpro shadow || true
          npx prisma migrate diff --from-migrations prisma/migrations --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url postgresql://intelpro:intelpro@localhost:5432/shadow --exit-code
        env:
          PGPASSWORD: intelpro
      - name: Seed
        run: npm run db:seed
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit and integration tests
        run: npm test
      - name: Database constraint tests
        run: npm run test:db
        env:
          DATABASE_ADMIN_URL: postgresql://intelpro:intelpro@localhost:5432/postgres
      - name: Production build
        run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Browser end-to-end tests
        run: npm run test:e2e
        env:
          E2E_DEVNET: ${{ inputs.devnet && '1' || '0' }}
          # Devnet-only key that funds the throwaway test wallet (Settings → Secrets → Actions).
          DEVNET_TEST_KEY: ${{ secrets.DEVNET_TEST_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 14
